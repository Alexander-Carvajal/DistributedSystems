apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: store-security
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/platform/security
  prune: true
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: store-application
    - apiVersion: v1
      kind: Namespace
      name: store-web
  sourceRef:
    kind: GitRepository
    name: flux-system
