apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: store-web
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: store-observability
  path: ./deploy/overlays/dev/web
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
