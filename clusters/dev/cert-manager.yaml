apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: store-cert-manager
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/platform/cert-manager
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
