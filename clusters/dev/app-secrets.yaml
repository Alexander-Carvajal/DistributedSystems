apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: store-app-secrets
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: store-security
    - name: store-queue
  path: ./deploy/overlays/dev/app-secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
