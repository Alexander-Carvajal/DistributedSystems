apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: distributed-lab
servers: 1
agents: 0
image: rancher/k3s:v1.35.10-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6445"
ports:
  - port: 127.0.0.1:8081:80
    nodeFilters:
      - loadbalancer
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
