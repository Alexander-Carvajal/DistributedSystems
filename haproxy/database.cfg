global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 1m
    timeout server 1m

frontend galera_sql
    bind *:3306
    default_backend galera_writers

# Galera is multi-primary: route both reads and writes to any synced node.
# MySQL protocol checks remove nodes that cannot complete a SQL handshake.
backend galera_writers
    balance leastconn
    option mysql-check
    default-server inter 2s fall 3 rise 2
    server galera1 galera1:3306 check
    server galera2 galera2:3306 check
    server galera3 galera3:3306 check
