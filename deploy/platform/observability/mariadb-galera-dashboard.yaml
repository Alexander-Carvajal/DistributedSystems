apiVersion: v1
kind: ConfigMap
metadata:
  name: store-mariadb-galera-dashboard
  namespace: observability
data:
  mariadb-galera.json: |
    {
      "uid": "store-mariadb-galera",
      "title": "Store MariaDB Galera",
      "description": "Per-node readiness, synchronization, cluster membership, scrape health, and replication queue.",
      "tags": ["store-platform", "mariadb", "galera"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Galera cluster size",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "refId": "A", "expr": "min(mysql_global_status_wsrep_cluster_size)", "legendFormat": "members" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 3 }] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto" }
        },
        {
          "id": 2,
          "title": "Node readiness (1 = ready)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "refId": "A", "expr": "mysql_global_status_wsrep_ready", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1 }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 3,
          "title": "Node synchronization state (4 = Synced)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "refId": "A", "expr": "mysql_global_status_wsrep_local_state", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 4 }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 4,
          "title": "Exporter scrape status (1 = up)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "targets": [{ "refId": "A", "expr": "up{job=\"mariadb-galera\"}", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1 }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 5,
          "title": "Galera receive queue by node",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [{ "refId": "A", "expr": "mysql_global_status_wsrep_local_recv_queue", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
