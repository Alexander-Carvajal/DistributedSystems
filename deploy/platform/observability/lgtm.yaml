apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otel-lgtm
  namespace: observability
spec:
  serviceName: otel-lgtm
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.41.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 9090
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1500m"
              memory: 2Gi
          startupProbe:
            exec:
              command: [cat, /tmp/ready]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [cat, /tmp/ready]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [cat, /tmp/ready]
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data/grafana
              subPath: grafana
            - name: data
              mountPath: /data/prometheus
              subPath: prometheus
            - name: data
              mountPath: /data/loki
              subPath: loki
            - name: data
              mountPath: /loki
              subPath: loki-storage
            - name: data
              mountPath: /data/tempo
              subPath: tempo
            - name: data
              mountPath: /data/pyroscope
              subPath: pyroscope
            - name: dashboard-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml
              subPath: custom.yaml
            - name: api-dashboard
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/custom
            - name: alert-rules
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting/store-api-slo.yaml
              subPath: rules.yaml
      volumes:
        - name: dashboard-provider
          configMap:
            name: otel-lgtm-dashboard-provider
        - name: api-dashboard
          configMap:
            name: store-api-red-dashboard
        - name: alert-rules
          configMap:
            name: store-api-slo-alerts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: observability
spec:
  selector:
    app: otel-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: tempo
      port: 3200
      targetPort: 3200
    - name: loki
      port: 3100
      targetPort: 3100
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 9090
      targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-lgtm
                port:
                  name: grafana
