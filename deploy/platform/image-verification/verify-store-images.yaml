apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-store-release-images
  annotations:
    policies.kyverno.io/title: Verify Store release image signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.20.0
    policies.kyverno.io/description: >-
      Verifies keyless Cosign signatures for the API and web images published
      by this repository's GitHub Actions release workflow.
spec:
  validationActions:
    - Audit
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: ghcr.io/alexander-carvajal/distributedsystems/store-api:*
    - glob: ghcr.io/alexander-carvajal/distributedsystems/store-api@sha256:*
    - glob: ghcr.io/alexander-carvajal/distributedsystems/store-web:*
    - glob: ghcr.io/alexander-carvajal/distributedsystems/store-web@sha256:*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: github-release-workflow
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/Alexander-Carvajal/DistributedSystems/.github/workflows/release.yml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  variables:
    - name: allImages
      expression: images.?containers.orValue([]) + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.allImages.map(image, verifyImageSignatures(image, [attestors.github-release-workflow])).all(count, count > 0)
      message: Images must be signed by the trusted GitHub Actions release workflow.
