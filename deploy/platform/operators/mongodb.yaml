apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-kubernetes
  namespace: flux-system
spec:
  interval: 30m
  timeout: 20m
  releaseName: mongodb-kubernetes
  targetNamespace: store-data
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: mongodb-kubernetes
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: mongodb
  values:
    operator:
      watchedResources:
        - mongodbcommunity
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 750m
          memory: 768Mi
