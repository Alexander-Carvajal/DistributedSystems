apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 20m
  releaseName: redis-operator
  targetNamespace: store-data
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: redis-operator
      version: 0.27.0
      sourceRef:
        kind: HelmRepository
        name: redis-operator
