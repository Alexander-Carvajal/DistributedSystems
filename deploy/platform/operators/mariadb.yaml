apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  interval: 30m
  timeout: 20m
  releaseName: mariadb-operator-crds
  targetNamespace: store-data
  chart:
    spec:
      chart: mariadb-operator-crds
      version: 26.10.2
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 20m
  releaseName: mariadb-operator
  targetNamespace: store-data
  dependsOn:
    - name: mariadb-operator-crds
  chart:
    spec:
      chart: mariadb-operator
      version: 26.10.2
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
  values:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 384Mi
