apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: kyverno
  targetNamespace: kyverno
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kyverno
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
