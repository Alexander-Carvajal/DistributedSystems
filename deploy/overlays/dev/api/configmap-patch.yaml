apiVersion: v1
kind: ConfigMap
metadata:
  name: store-api-config
  namespace: store-application
data:
  OTEL_SERVICE_NAME: store-api
  OTEL_SERVICE_NAMESPACE: store-application
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,k8s.namespace.name=store-application
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway-opentelemetry-collector.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_PROPAGATORS: tracecontext,baggage
  NODE_OPTIONS: --experimental-loader=@opentelemetry/instrumentation/hook.mjs --require @opentelemetry/auto-instrumentations-node/register
