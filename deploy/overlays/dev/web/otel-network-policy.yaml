apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-web-otel-egress
  namespace: store-web
spec:
  podSelector:
    matchLabels:
      app: store-web
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: otel-gateway
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
