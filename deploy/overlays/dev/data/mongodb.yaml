apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: store-mongodb
  namespace: store-data
spec:
  version: "8.0.0"
  type: ReplicaSet
  members: 1
  security:
    authentication:
      modes:
        - SCRAM
  users:
    - name: store_app
      db: store_reviews
      passwordSecretRef:
        name: store-mongodb-user
      roles:
        - name: readWrite
          db: store_reviews
      scramCredentialsSecretName: store-mongodb-scram
  statefulSet:
    spec:
      template:
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: 150m
                  memory: 384Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
            - name: mongodb-agent
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
