    matchLabels:
      app: store-redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: store-redis-sentinel
  namespace: store-data
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: store-redis-sentinel
