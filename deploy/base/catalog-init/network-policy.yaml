apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-catalog-init-allow
  namespace: store-application
spec:
  podSelector:
    matchLabels:
      batch.kubernetes.io/job-name: store-catalog-init-v2
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-data
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 27017
