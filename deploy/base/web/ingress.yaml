apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-web
  namespace: store-web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: store-web-store-web-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-web
                port:
                  name: http
