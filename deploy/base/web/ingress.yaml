apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-web
  namespace: store-web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: store-web-store-web-auth@kubernetescrd,store-web-store-web-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [store.localhost]
      secretName: store-web-tls
  rules:
    - host: store.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-web
                port:
                  name: http
