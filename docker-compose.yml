name: distributed-three-tier

services:
  presentation-lb-master:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/presentation-master.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.30.0.11

  presentation-lb-backup:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/presentation-backup.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.30.0.12

  presentation-entry:
    image: haproxy:3.2-alpine
    ports:
      - "80:80"
    volumes:
      - ./haproxy/presentation-entry.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      - presentation-lb-master
      - presentation-lb-backup
    networks:
      - edge

  presentation-keepalived-master:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: presentation-master.conf
    network_mode: "service:presentation-lb-master"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: unless-stopped
    depends_on:
      presentation-lb-master:
        condition: service_started

  presentation-keepalived-backup:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: presentation-backup.conf
    network_mode: "service:presentation-lb-backup"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: unless-stopped
    depends_on:
      presentation-lb-backup:
        condition: service_started

  web1:
    image: nginx:alpine
    hostname: webnode1
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site1:/usr/share/nginx/html:ro
      - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
      - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
      - application-lb-master
    networks:
      - edge
      - application

  web2:
    image: nginx:alpine
    hostname: webnode2
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site2:/usr/share/nginx/html:ro
      - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
      - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
      - application-lb-master
    networks:
      - edge
      - application

  web3:
    image: nginx:alpine
    hostname: webnode3
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site3:/usr/share/nginx/html:ro
      - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
      - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
      - application-lb-master
    networks:
      - edge
      - application

  application-lb-master:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/application-master.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      application:
        ipv4_address: 172.31.0.11

  application-lb-backup:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/application-backup.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      application:
        ipv4_address: 172.31.0.12

  application-keepalived-master:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: application-master.conf
    network_mode: "service:application-lb-master"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: unless-stopped
    depends_on:
      application-lb-master:
        condition: service_started

  application-keepalived-backup:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: application-backup.conf
    network_mode: "service:application-lb-backup"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: unless-stopped
    depends_on:
      application-lb-backup:
        condition: service_started

  app1:
    build: ./application
    environment: &application-environment
      DB_HOST: database-proxy
      DB_PORT: 3306
      DB_ROUTER_NAME: database-proxy
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-5}
      DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MONGO_HOSTS: mongodb1:27017,mongodb2:27017,mongodb3:27017
      MONGO_REPLICA_SET: store-rs
      MONGO_DB: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-10}
      MONGO_USER: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      REDIS_SENTINELS: redis-sentinel1:26379,redis-sentinel2:26379,redis-sentinel3:26379
      REDIS_MASTER_NAME: store-cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      APPLICATION_NODE: app1
    restart: unless-stopped
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
      - application
      - database

  app2:
    build: ./application
    environment:
      <<: *application-environment
      APPLICATION_NODE: app2
    restart: unless-stopped
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
      - application
      - database

  app3:
    build: ./application
    environment:
      <<: *application-environment
      APPLICATION_NODE: app3
    restart: unless-stopped
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
      - application
      - database

  catalog-init:
    build: ./application
    command: ["node", "init-db.js"]
    environment: *application-environment
    volumes:
      - ./database/catalog.sql:/app/database/catalog.sql:ro
    restart: "no"
    depends_on:
      database-proxy:
        condition: service_started
      galera3:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis-sentinel1:
        condition: service_healthy
      redis-sentinel2:
        condition: service_healthy
      redis-sentinel3:
        condition: service_healthy
    networks:
      - database

  mongodb1:
    image: mongo:8
    entrypoint: ["bash", "/usr/local/bin/mongo-keyfile-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb-data:/data/db
      - ./database/mongo-keyfile-entrypoint.sh:/usr/local/bin/mongo-keyfile-entrypoint.sh:ro
    secrets:
      - mongodb-keyfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database

  mongodb2:
    image: mongo:8
    entrypoint: ["bash", "/usr/local/bin/mongo-keyfile-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb2-data:/data/db
      - ./database/mongo-keyfile-entrypoint.sh:/usr/local/bin/mongo-keyfile-entrypoint.sh:ro
    secrets:
      - mongodb-keyfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database

  mongodb3:
    image: mongo:8
    entrypoint: ["bash", "/usr/local/bin/mongo-keyfile-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb3-data:/data/db
      - ./database/mongo-keyfile-entrypoint.sh:/usr/local/bin/mongo-keyfile-entrypoint.sh:ro
    secrets:
      - mongodb-keyfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database

  mongo-init:
    image: mongo:8
    command:
      [
        "mongosh",
        "--quiet",
        "--host",
        "mongodb1",
        "--username",
        "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}",
        "--password",
        "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}",
        "--authenticationDatabase",
        "admin",
        "--file",
        "/scripts/init-mongo-replica.js",
      ]
    environment:
      MONGO_DB_NAME: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - ./database/init-mongo-replica.js:/scripts/init-mongo-replica.js:ro
    restart: "no"
    depends_on:
      mongodb1:
        condition: service_healthy
      mongodb2:
        condition: service_healthy
      mongodb3:
        condition: service_healthy
    networks:
      - database

  redis-primary:
    image: redis:7-alpine
    entrypoint: ["sh", "/usr/local/bin/server-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_ROLE: primary
    volumes:
      - redis-primary-data:/data
      - ./redis/server-entrypoint.sh:/usr/local/bin/server-entrypoint.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      database:
        ipv4_address: 172.32.0.10

  redis-replica:
    image: redis:7-alpine
    entrypoint: ["sh", "/usr/local/bin/server-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_ROLE: replica
    volumes:
      - redis-replica-data:/data
      - ./redis/server-entrypoint.sh:/usr/local/bin/server-entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      database:
        ipv4_address: 172.32.0.11

  redis-sentinel1:
    image: redis:7-alpine
    entrypoint: ["sh", "/usr/local/bin/sentinel-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-sentinel1-data:/data
      - ./redis/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - database

  redis-sentinel2:
    image: redis:7-alpine
    entrypoint: ["sh", "/usr/local/bin/sentinel-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-sentinel2-data:/data
      - ./redis/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - database

  redis-sentinel3:
    image: redis:7-alpine
    entrypoint: ["sh", "/usr/local/bin/sentinel-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-sentinel3-data:/data
      - ./redis/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - database

  database-proxy:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/database.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      galera3:
        condition: service_healthy
    networks:
      - database

  galera1:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      MARIADB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      MARIADB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "yes"
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD in .env}
    volumes:
      - galera1-data:/bitnami/mariadb
    # Give Galera time to leave the Primary Component cleanly so its final
    # state can be written before dependent nodes are stopped.
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - database

  galera2:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "no"
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD in .env}
    volumes:
      - galera2-data:/bitnami/mariadb
    stop_grace_period: 1m
    depends_on:
      galera1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - database

  galera3:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "no"
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD in .env}
    volumes:
      - galera3-data:/bitnami/mariadb
    stop_grace_period: 1m
    depends_on:
      galera2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - database

  nagios:
    image: jasonrivers/nagios:latest
    ports:
      - "8088:80"
    environment:
      NAGIOSADMIN_USER: nagiosadmin
      NAGIOSADMIN_PASS: ${NAGIOSADMIN_PASSWORD:?Set NAGIOSADMIN_PASSWORD in .env}
    volumes:
      - ./nagios/architecture.cfg:/opt/nagios/etc/objects/localhost.cfg:ro
    depends_on:
      - presentation-lb-master
      - presentation-lb-backup
      - presentation-keepalived-master
      - presentation-keepalived-backup
      - web1
      - web2
      - web3
      - application-lb-master
      - application-lb-backup
      - application-keepalived-master
      - application-keepalived-backup
      - app1
      - app2
      - app3
      - catalog-init
      - galera1
      - galera2
      - galera3
      - mongodb1
      - mongodb2
      - mongodb3
      - mongo-init
      - redis-primary
      - redis-replica
      - redis-sentinel1
      - redis-sentinel2
      - redis-sentinel3
      - database-proxy
    networks:
      - edge
      - application
      - database

volumes:
  galera1-data:
  galera2-data:
  galera3-data:
  mongodb-data:
  mongodb2-data:
  mongodb3-data:
  redis-primary-data:
  redis-replica-data:
  redis-sentinel1-data:
  redis-sentinel2-data:
  redis-sentinel3-data:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  application:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  database:
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24

secrets:
  mongodb-keyfile:
    file: ./secrets/mongodb-keyfile
