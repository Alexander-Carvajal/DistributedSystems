name: Release images

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Build, publish, and sign images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${repository}/store-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repository}/store-web" >> "$GITHUB_OUTPUT"

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: application
          push: true
          tags: ${{ steps.images.outputs.api }}:sha-${{ github.sha }}

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ steps.images.outputs.web }}:sha-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image digests
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "${API_IMAGE}@${API_DIGEST}"
          cosign sign --yes "${WEB_IMAGE}@${WEB_DIGEST}"

      - name: Generate image SBOMs
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.images.outputs.api }}:sha-${{ github.sha }}
          format: cyclonedx
          output: store-api-sbom.cdx.json

      - name: Generate web image SBOM
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.images.outputs.web }}:sha-${{ github.sha }}
          format: cyclonedx
          output: store-web-sbom.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms-${{ github.sha }}
          path: "*-sbom.cdx.json"
          if-no-files-found: error
          retention-days: 90
